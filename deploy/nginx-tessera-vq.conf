# Public rate-limited front for the tessera-vq bolt-on (internal 127.0.0.1:8010).
limit_req_zone  $binary_remote_addr zone=vq:10m   rate=2r/s;
limit_conn_zone $binary_remote_addr zone=vqc:10m;

server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    client_max_body_size 64k;
    proxy_read_timeout   120s;

    location = /health {
        proxy_pass http://127.0.0.1:8010;
    }
    location / {
        limit_req  zone=vq burst=5 nodelay;
        limit_conn vqc 4;
        limit_req_status  429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8010;
    }
}
