[Service]
# Durable response cache (compute-once-keep-forever, LRU at the cap).
Environment=TESSERA_VQ_CACHE_DIR=/home/sk818/tessera-vq-cache
Environment=TESSERA_VQ_CACHE_MAX_GB=500
# Bind internal only; nginx (see nginx-tessera-vq.conf) owns the public :8000.
Environment=TESSERA_VQ_BIND=127.0.0.1:8010
